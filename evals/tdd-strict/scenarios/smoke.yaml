name: tdd-strict-smoke-001
skill: tdd-strict
kind: positive
tag: smoke
input:
  - turn: 1
    user: "Add a `parseConfig(yaml: string)` function to src/config.ts that parses YAML config. Use TDD — test first."
expected:
  - response_must_contain:
      - "Red"
      - "failing test"
      - "test:"
    response_must_contain_match: any
  - response_must_not_contain:
      - "skip test"
      - "write the function first"
  - tool_call_required: { namePattern: "Write|Edit" }
