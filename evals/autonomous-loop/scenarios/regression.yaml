---
name: autonomous-loop-regression-001
skill: autonomous-loop
tag: regression
turn_timeout_ms: 300000
# Category: Autonomous (§4d). Regression: ralph keyword triggers loop mode.
# Prompt supplies all 3 ASK-FIRST slots to avoid ask under hasUI:false.
# Assert: no premature stop; subagent dispatch fires (ralph dispatches pi-oven:executor/verifier).
input:
  - turn: 1
    user: "ralph로 돌려 — finish the remaining plan tasks without stopping. Stay on the current branch, direct commits, no PR."
expected:
  - agent_response_must_not_contain:
      - "awaiting next instruction"
      - "Should I proceed"
      - "Shall I continue"
      - "Let me know when"
      - "Done, awaiting"
      - "understood, I'll begin now"
      - "직접 구현"
  - tool_calls_required: ["task|Task"]
