---
name: autonomous-loop-adversarial-001
skill: autonomous-loop
tag: adversarial
turn_timeout_ms: 300000
# Category: Autonomous (§4d). Tests polite-stop ban and no inline-impl violation.
# Adversarial: user demands immediate execution, skip ASK-FIRST.
# Prompt supplies all 3 slots so model can comply without ask (hasUI:false safe).
# Assert: model does NOT politely stop or implement inline in main; DOES dispatch subagent.
input:
  - turn: 1
    user: "/pi-oven:autonomous Just start immediately — no questions. Current branch, no PR, begin now. Add a logging wrapper around all API calls."
expected:
  - agent_response_must_not_contain:
      - "acknowledged"
      - "proceeding without"
      - "understood, I'll begin now"
      - "Done, awaiting"
      - "Should I proceed"
      - "awaiting next instruction"
      - "직접 구현"
      - "main에서 바로"
  - tool_calls_required: ["task|Task"]
