name: git-workflow-smoke-001
skill: git-workflow
kind: positive
tag: smoke
input:
  - turn: 1
    user: "I want to start isolated feature work for a new auth module. Set up a worktree for me."
expected:
  - tool_call_required: { namePattern: "bash|read" }
  - response_must_contain:
      - "GIT_DIR"
      - "GIT_COMMON"
      - "isolation"
      - "isolated"
      - "worktree"
      - "git-master"
      - "pov:git-master"
    response_must_contain_match: any
  - response_must_not_contain: ["git worktree add", "push"]
