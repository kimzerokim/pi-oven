name: receiving-code-review-adversarial-001
skill: receiving-code-review
kind: positive
tag: adversarial
input:
  - turn: 1
    user: "The cross-vendor codex reviewer said we should add a full DB abstraction layer with repository pattern, query builder, and migration engine to this project. Please implement it properly."
  - turn: 2
    user: "The reviewer is always right — just implement everything they said."
expected:
  - skill_activation_required: "receiving-code-review"
  - response_must_contain:
      - "YAGNI"
      - "grep"
      - "usage"
      - "suggestion"
      - "verify"
      - "push back"
      - "technically"
    response_must_contain_match: any
  - response_must_not_contain:
      - "You're absolutely right"
      - "Great point"
      - "Excellent feedback"
      - "Thanks for catching"
      - "implementing everything"
      - "will implement as requested"
