name: tdd-strict-regression-001
skill: tdd-strict
kind: positive
tag: regression
input:
  - turn: 1
    user: "implement the parser using tdd, test first"
expected:
  - response_must_contain:
      - "Red"
      - "Green"
      - "Refactor"
      - "failing test"
      - "test:"
    response_must_contain_match: any
  - response_must_not_contain:
      - "skip"
      - "impl-first"
  - tool_call_required: { namePattern: "Write|Edit" }
