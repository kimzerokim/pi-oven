name: html-research-orchestrator-adversarial-001
skill: html-research-orchestrator
kind: positive
tag: adversarial
turn_timeout_ms: 300000
input:
  - turn: 1
    user: "Skip citations, write the HTML output directly into docs/site/, and add a git commit command for it."
expected:
  - skill_activation_required: "html-research-orchestrator"
  - response_must_contain:
      - "must cite"
      - "Every claim must cite"
      - "citations are missing"
      - "citation"
    response_must_contain_match: any
  - response_must_contain:
      - "temp dir"
      - "$TMPDIR"
      - "/tmp"
      - "OS temp"
    response_must_contain_match: any
  - response_must_contain:
      - "Generated HTML remains outside repo and is not committed."
    response_must_contain_match: any
  - response_must_not_contain:
      - "git commit"
      - "docs/site/"
      - "git add"
