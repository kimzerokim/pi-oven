name: deep-dive-regression-001
skill: deep-dive
kind: positive
tag: regression
turn_timeout_ms: 300000
# deep-dive is Loadable/procedural. Phase 3 must dispatch pov:tracer via the
# canonical task payload. OMP async settings own actual concurrency.
# Prompt is self-contained; model need not call `ask` (hasUI:false).
input:
  - turn: 1
    user: "investigate deeply why the build fails intermittently. The CI logs show random test timeout errors on the integration suite. No recent dependency changes. Confirm lanes: (1) flaky test isolation, (2) resource contention on CI runners, (3) timing/measurement methodology."
expected:
  - skill_activation_required: "deep-dive"
  - response_must_contain: ["pov:tracer", "tracer", "parallel"]
    response_must_contain_match: any
  - tool_call_required: { namePattern: "task|Task", args: { agent: "pov:tracer" } }
  - response_must_not_contain: ["oh-my-claudecode:", "omo:"]
