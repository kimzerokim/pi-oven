name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun check
      - name: Build extension
        run: bun run build
      - name: Run TDD tests (eval-runner + scripts)
        run: bun test
        # Real eval execution (bun scripts/run-eval.ts --tag smoke) requires LLM provider keys
        # and is gated behind Plan 4 (setup wizard + CI secrets bootstrap).
      - name: Lint pi-oven agent files
        run: bun run lint:agents
      - name: Lint pi-oven skill files
        run: bun run lint:skills
      - name: Validate marketplace catalog JSON
        run: |
          jq . .claude-plugin/marketplace.json > /dev/null
          jq . .claude-plugin/plugin.json > /dev/null
