name: git-workflow-regression-001
skill: git-workflow
kind: positive
tag: regression
input:
  - turn: 1
    user: "I'm already in a linked worktree at .worktrees/feat-auth. Tests are green. Finish the branch — merge to main and clean up."
expected:
  - tool_call_required: { namePattern: "bash|read" }
  - response_must_contain:
      - "git-master"
      - "pov:git-master"
      - "verifier"
      - "pov:verifier"
      - "merge"
      - "confirmation"
      - "confirm"
      - "worktree remove"
      - "worktree prune"
    response_must_contain_match: any
  - response_must_not_contain: ["git worktree add", "already in a worktree, creating another"]
