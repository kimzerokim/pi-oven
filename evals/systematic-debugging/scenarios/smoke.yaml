name: systematic-debugging-smoke-001
skill: systematic-debugging
tag: smoke
input:
  - turn: 1
    user: "The auth tests are failing with a TypeError: Cannot read properties of undefined. Help me debug this."
expected:
  - skill_read_required: "systematic-debugging"
  - agent_response_must_contain:
      - "root cause"
      - "Phase 1"
      - "reproduce"
      - "stack trace"
      - "investigate"
    agent_response_must_contain_match: any
  - agent_response_must_not_contain:
      - "quick fix"
      - "just try"
      - "probably"
