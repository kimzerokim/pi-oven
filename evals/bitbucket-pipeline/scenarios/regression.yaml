name: bitbucket-pipeline-regression-001
skill: bitbucket-pipeline
kind: positive
tag: regression
input:
  - turn: 1
    user: "The Bitbucket pipeline failed on the deploy step. Show me the step logs and list the repository variables."
expected:
  - skill_activation_required: "bitbucket-pipeline"
  - response_must_contain:
      - "credential"
      - "workspace"
      - "repo_slug"
      - "step log"
      - "repository variable"
      - "api.bitbucket.org"
      - "read-only"
    response_must_contain_match: any
  - response_must_not_contain:
      - "mutation"
      - "cannot help"
      - "api_token="
  - tool_call_required: { namePattern: "read|Read" }
