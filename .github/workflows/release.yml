name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PI_OVEN_EVAL_AGENT_DB_B64: ${{ secrets.PI_OVEN_EVAL_AGENT_DB_B64 }}
      PI_OVEN_EVAL_MODEL: openai-codex/gpt-5.4
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Validate tag, version, and immutable marketplace ref
        run: bun run release:contract -- --tag "$GITHUB_REF_NAME" --check-only
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Validate generated contracts
        run: bun run contract:check
      - name: Typecheck
        run: bun run check
      - name: Lint agents and skills
        run: |
          bun run lint:agents
          bun run lint:skills
      - name: Build extension
        run: bun run build
      - name: Run hermetic tests with coverage
        run: bun run test:hermetic -- --coverage --coverage-reporter=lcov --coverage-reporter=text
      - name: Enforce coverage floors and no-decrease ratchet
        run: bun run check:coverage -- --baseline-ref origin/main
      - name: Run release-eval contract tests
        run: bun test tests/scripts/run-eval.test.ts
      - name: Run correctness-first runtime benchmark
        run: bun run bench:runtime
      - name: Run fake-ok discrimination gate
        run: bun scripts/check-eval-discrimination.ts
      - name: Run integrated release rehearsal
        run: bun scripts/rehearse-release.ts --out dist/release-eval/runtime-contract-rehearsal.json
      - name: Require trusted release eval credentials
        run: |
          mkdir -p dist/release-eval
          if [ -z "$PI_OVEN_EVAL_AGENT_DB_B64" ]; then
            jq -n --arg model "$PI_OVEN_EVAL_MODEL" '{tier:"release-eval",status:"NOT_RUN",reason:"credentials-unavailable",exactModel:$model}' > dist/release-eval/release-eval-receipt.json
            echo "Release eval: NOT RUN (credentials unavailable); publishing is blocked" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p "$HOME/.omp/agent"
          printf '%s' "$PI_OVEN_EVAL_AGENT_DB_B64" | base64 --decode > "$HOME/.omp/agent/agent.db"
          chmod 600 "$HOME/.omp/agent/agent.db"
          jq -n --arg model "$PI_OVEN_EVAL_MODEL" '{tier:"release-eval",status:"RUNNING",exactModel:$model}' > dist/release-eval/release-eval-receipt.json
      - name: Run strict canonical release canary
        run: >-
          timeout --signal=TERM 12m
          bun scripts/canary-runtime-dispatch.ts
          --out dist/release-eval/canary-receipt.json
          --model "$PI_OVEN_EVAL_MODEL"
          --strict --require-scenarios
      - name: Run all tagged release canary scenarios
        run: >-
          timeout --signal=TERM 20m
          bun scripts/run-eval.ts --tag canary
          --strict --require-scenarios
          --model "$PI_OVEN_EVAL_MODEL"
          --out dist/release-eval/tagged-canary-eval.jsonl
      - name: Run strict release regression eval
        run: >-
          timeout --signal=TERM 35m
          bun scripts/run-eval.ts --tag regression
          --strict --require-scenarios
          --model "$PI_OVEN_EVAL_MODEL"
          --out dist/release-eval/regression-eval.jsonl
      - name: Mark release eval PASS
        run: >-
          jq '.status = "PASS"' dist/release-eval/release-eval-receipt.json
          > dist/release-eval/release-eval-receipt.next.json
          && mv dist/release-eval/release-eval-receipt.next.json dist/release-eval/release-eval-receipt.json
      - name: Upload release eval evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-eval-${{ github.ref_name }}
          path: dist/release-eval/
          if-no-files-found: error
      - name: Build deterministic release artifacts
        run: bun run release:contract -- --tag "$GITHUB_REF_NAME" --out-dir dist/release
      - name: Verify artifact checksum
        working-directory: dist/release
        run: sha256sum --check "pi-oven-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Fresh-HOME install smoke
        run: >-
          bun scripts/pi-oven-release/fresh-install-smoke.ts
          --archive "dist/release/pi-oven-${GITHUB_REF_NAME}.tar.gz"
          --manifest "dist/release/pi-oven-${GITHUB_REF_NAME}.manifest.json"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "dist/release/pi-oven-${{ github.ref_name }}.tar.gz"
      - name: Attest SPDX SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: "dist/release/pi-oven-${{ github.ref_name }}.tar.gz"
          sbom-path: "dist/release/pi-oven-${{ github.ref_name }}.spdx.json"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes
