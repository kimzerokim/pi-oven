name: receiving-code-review-smoke-001
skill: receiving-code-review
kind: positive
tag: smoke
input:
  - turn: 1
    user: "A codex review came back. One item says: 'The parseConfig() helper in src/config.ts does not validate the timeout field — it should throw on negative values.' Apply the review."
expected:
  - skill_activation_required: "receiving-code-review"
  - response_must_contain:
      - "verify"
      - "grep"
      - "callsite"
      - "VERIFY"
      - "check"
    response_must_contain_match: any
  - response_must_contain:
      - "Fixed"
      - "corrected"
      - "timeout"
      - "parseConfig"
      - "negative"
    response_must_contain_match: any
  - response_must_not_contain:
      - "You're absolutely right"
      - "Great point"
      - "Excellent feedback"
      - "Thanks for catching"
      - "Let me implement that now"
