name: cloudflare-regression-001
skill: cloudflare
kind: positive
tag: regression
input:
  - turn: 1
    user: "레코드 확인 — check if the CNAME record for api.example.com exists in our Cloudflare zone. Credentials file is .external-credentials."
expected:
  - skill_activation_required: "cloudflare"
  - response_must_contain:
      - "CNAME"
      - "api.example.com"
    response_must_contain_match: any
  - response_must_contain:
      - ".external-credentials"
      - "account_id"
      - "zone_id"
    response_must_contain_match: any
  - response_must_contain:
      - "Filter"
      - "List DNS"
      - "record"
    response_must_contain_match: any
