name: large-task-delegation-smoke-001
skill: large-task-delegation
kind: positive
tag: smoke
turn_timeout_ms: 300000
description: >
  Trigger threshold met (3+ files, 300 LoC). Model should read the skill
  and plan dispatch — not implement inline.
input:
  - turn: 1
    user: "Refactor the auth module — 5 files, ~300 LoC"
expected:
  - skill_activation_required: "large-task-delegation"
  - response_must_contain:
      - "dispatch"
      - "executor"
      - "scope"
      - "pov:executor"
    response_must_contain_match: any
  - response_must_not_contain:
      - "editing directly"
      - "I will edit"
      - "Let me edit"
      - "writing the code myself"
  - tool_call_required: { namePattern: "Task|task", args: { agent: "pov:executor" } }
