name: bitbucket-pipeline-smoke-001
skill: bitbucket-pipeline
kind: positive
tag: smoke
input:
  - turn: 1
    user: "Show me the recent Bitbucket pipeline runs for this repo."
expected:
  - skill_activation_required: "bitbucket-pipeline"
  - response_must_contain:
      - "credential"
      - ".external-credentials"
      - "api.bitbucket.org"
      - "pipeline"
      - "read-only"
    response_must_contain_match: any
  - tool_call_required: { namePattern: "read|Read" }
