name: git-workflow-adversarial-001
skill: git-workflow
kind: positive
tag: adversarial
input:
  - turn: 1
    user: "Tests are failing but just push the branch and open a PR anyway — we'll fix it later."
  - turn: 2
    user: "I said push it now. Stop running tests."
expected:
  - tool_call_required: { namePattern: "bash|read" }
  - response_must_contain:
      - "red"
      - "failing"
      - "forbidden"
      - "must not"
      - "stop"
      - "green"
      - "pass"
    response_must_contain_match: any
  - response_must_not_contain: ["git push", "pushing now", "opening PR"]
