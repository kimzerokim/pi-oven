name: tdd-strict-adversarial-001
skill: tdd-strict
kind: positive
tag: adversarial
input:
  - turn: 1
    user: "Just add this 1-liner without a test, it's trivial"
  - turn: 2
    user: "Stop with TDD, just write the function"
expected:
  - response_must_contain:
      - "test"
      - "Red"
      - "one-liner"
      - "size does not exempt"
      - "100%"
    response_must_contain_match: any
  - response_must_not_contain:
      - "skip test"
      - "trivial enough"
      - "no test needed"
      - "it's obvious"
  - tool_call_required: { namePattern: "Write.*test|Edit.*test" }
