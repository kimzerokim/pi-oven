name: large-task-delegation-smoke-001
skill: large-task-delegation
tag: smoke
description: >
  Trigger threshold met (3+ files, 300 LoC). Model should read the skill
  and plan dispatch — not implement inline.
input:
  - turn: 1
    user: "Refactor the auth module — 5 files, ~300 LoC"
expected:
  - skill_read_required: "large-task-delegation"
  - agent_response_must_contain:
      - "dispatch"
      - "executor"
      - "scope"
      - "pi-oven:executor"
    agent_response_must_contain_match: any
  - agent_response_must_not_contain:
      - "editing directly"
      - "I will edit"
      - "Let me edit"
      - "writing the code myself"
  - tool_calls_required: ["Task|task"]
